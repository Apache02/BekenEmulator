name: Beken Simulator Release (Windows & Linux)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout release source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.ref }}

    - name: Set up Python 3.10 x64
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        architecture: "x64"
        cache: pip

    - name: Install emulator dependencies
      run: python -m pip install -r requirements.txt

    # Unicorn's generated control flow is incompatible with the CFG-enabled
    # Windows bootloader shipped in PyInstaller wheels. Build the documented
    # no-CFG bootloader from source; the packaged Unicorn smoke test below
    # fails with 0xC0000409 if this ever regresses.
    - name: Install PyInstaller with a no-CFG bootloader
      shell: pwsh
      run: |
        $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
        $env:PYINSTALLER_BOOTLOADER_WAF_ARGS = "--no-cfg"
        python -m pip install --no-cache-dir --no-binary=PyInstaller "PyInstaller==6.22.3"

    - name: Build standalone Windows executable
      shell: pwsh
      run: .\tools\build_windows_release.ps1

    - name: Smoke-test packaged Unicorn runtime and firmware resources
      shell: pwsh
      run: |
        $process = Start-Process `
          -FilePath ".\dist\BekenSimulator.exe" `
          -ArgumentList "--package-smoke" `
          -Wait -PassThru -NoNewWindow
        if ($process.ExitCode -ne 0) {
          throw "Packaged runtime smoke test failed with exit code $($process.ExitCode)"
        }

    - name: Run packaged GUI self-tests
      shell: pwsh
      run: |
        $process = Start-Process `
          -FilePath ".\dist\BekenSimulator.exe" `
          -ArgumentList "--selftest" `
          -Wait -PassThru -NoNewWindow
        if ($process.ExitCode -ne 0) {
          throw "Packaged UI self-test failed with exit code $($process.ExitCode)"
        }

    - name: Write SHA-256 checksum
      shell: pwsh
      run: |
        $hash = (Get-FileHash ".\dist\BekenSimulator.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  BekenSimulator.exe" | Set-Content ".\dist\BekenSimulator.exe.sha256" -NoNewline

    - name: Preserve workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: BekenSimulator-windows-x64
        path: |
          dist/BekenSimulator.exe
          dist/BekenSimulator.exe.sha256
        if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout release source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.ref }}

    - name: Set up Python 3.10 x64
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        architecture: "x64"
        cache: pip

    - name: Install system Tk and Xvfb dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb python3-tk tk8.6 tcl8.6 binutils

    - name: Install emulator dependencies and PyInstaller
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt "PyInstaller==6.22.3"

    - name: Build standalone Linux x64 executable
      run: bash ./tools/build_linux_release.sh

    - name: Smoke-test packaged Unicorn runtime and firmware resources
      run: ./dist/BekenSimulator-linux-x64 --package-smoke

    - name: Run packaged GUI self-tests
      run: xvfb-run -a ./dist/BekenSimulator-linux-x64 --selftest

    - name: Write SHA-256 checksum
      run: |
        (cd dist && sha256sum BekenSimulator-linux-x64 > BekenSimulator-linux-x64.sha256)

    - name: Preserve workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: BekenSimulator-linux-x64
        path: |
          dist/BekenSimulator-linux-x64
          dist/BekenSimulator-linux-x64.sha256
        if-no-files-found: error

  publish-release:
    needs: [windows-exe, linux-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: BekenSimulator-windows-x64
        path: release-assets

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: BekenSimulator-linux-x64
        path: release-assets

    - name: Publish or update GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ "${{ github.event_name }}" == "release" ]]; then
          TAG="${{ github.event.release.tag_name }}"
          TITLE="${TAG}"
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG="${{ github.ref_name }}"
          TITLE="Beken Simulator ${TAG}"
        else
          TAG="latest"
          TITLE="Beken Simulator (Latest Build)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG}" "${{ github.sha }}"
          git push -f origin "refs/tags/${TAG}"
        fi

        SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
        NOTES="Standalone Windows x64 (\`BekenSimulator.exe\`) and Linux x64 (\`BekenSimulator-linux-x64\`) builds with bundled sample firmwares (commit \`${SHORT_SHA}\`)."

        if ! gh release view "${TAG}" >/dev/null 2>&1; then
          gh release create "${TAG}" \
            --target "${{ github.sha }}" \
            --title "${TITLE}" \
            --notes "${NOTES}" \
            --latest
        elif [[ "${TAG}" == "latest" ]]; then
          gh release edit "${TAG}" \
            --target "${{ github.sha }}" \
            --title "${TITLE}" \
            --notes "${NOTES}" \
            --latest
        fi

        gh release upload "${TAG}" \
          release-assets/BekenSimulator.exe \
          release-assets/BekenSimulator.exe.sha256 \
          release-assets/BekenSimulator-linux-x64 \
          release-assets/BekenSimulator-linux-x64.sha256 \
          --clobber
